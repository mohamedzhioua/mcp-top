# Maintainer setup required before first use:
# configure a PyPI Trusted Publisher for this repository, workflow, and pypi environment.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the tagged commit is reachable from origin/main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tagged commit ${GITHUB_SHA} is not reachable from origin/main -- refusing to publish a commit that never landed on main" >&2
            exit 1
          fi
      - name: Verify tag version matches mcp_top.__version__
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          pkg_version="$(python -c 'import sys; sys.path.insert(0, "src"); import mcp_top; print(mcp_top.__version__)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag version '$tag_version' does not match mcp_top.__version__ '$pkg_version'" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$pkg_version" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: bash tests/run.sh
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify built dist matches the tagged version
        run: |
          set -euo pipefail
          python -c "import pathlib, sys; v = '$PACKAGE_VERSION'; d = pathlib.Path('dist'); w = sorted(d.glob(f'mcp_top-{v}-*.whl')); s = sorted(d.glob(f'mcp_top-{v}.tar.gz')); assert len(w) == 1 and len(s) == 1, f'expected exactly one wheel and one sdist for version {v} in dist/, found wheels={w} sdists={s}'"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
