name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash tests/run.sh

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m pip install --upgrade pipx uv

          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          mkdir -p "$PIPX_BIN_DIR"
          export PATH="$PIPX_BIN_DIR:$PATH"

          python -m pipx install "$wheel"
          (cd "$RUNNER_TEMP" && mcp-top --version)

          (cd "$RUNNER_TEMP" && uvx --from "$wheel" mcp-top --version)
