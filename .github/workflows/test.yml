name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash tests/run.sh

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Resolve built wheel path
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          # A bash glob over "$GITHUB_WORKSPACE"/dist/*.whl breaks on Windows
          # when the workspace path contains backslashes; resolve it through
          # pathlib instead and assert exactly one wheel was built.
          # Resolve to an ABSOLUTE path: the smoke commands below cd into
          # $RUNNER_TEMP, where a relative dist/ path no longer exists.
          wheel="$(python -c "import pathlib, sys; m = sorted(pathlib.Path('dist').glob('*.whl')); assert len(m) == 1, f'expected exactly one wheel in dist/, found: {m}'; print(m[0].resolve().as_posix())")"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="${{ steps.wheel.outputs.path }}"
          python -m pip install --upgrade pipx uv

          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          mkdir -p "$PIPX_BIN_DIR"
          export PATH="$PIPX_BIN_DIR:$PATH"

          python -m pipx install "$wheel"
          (cd "$RUNNER_TEMP" && mcp-top --version)

          (cd "$RUNNER_TEMP" && uvx --from "$wheel" mcp-top --version)
