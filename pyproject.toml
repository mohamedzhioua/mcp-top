[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-top"
dynamic = ["version"]
description = "Profile local MCP server context footprint and usage."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Zhioua Mohamed" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "claude",
  "codex",
  "cursor",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mohamedzhioua/mcp-top"
Repository = "https://github.com/mohamedzhioua/mcp-top"
Issues = "https://github.com/mohamedzhioua/mcp-top/issues"

[project.scripts]
mcp-top = "mcp_top.cli:main"

# The wheel ships only the mcp_top package (found under src/); it never picks
# up tests/, bin/, or docs/. The sdist's fuller tree (tests + goldens + bin +
# docs, a complete runnable test tree) is pinned separately via MANIFEST.in.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mcp_top.__version__" }
